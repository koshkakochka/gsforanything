# Auto-deploy the Cloudflare *dev* Worker (gs-dev) only.
# Production (Worker `gs` / gsforanything.com) stays manual: scripts/deploy-prod.sh --confirm.
name: Deploy Cloudflare dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

concurrency:
  group: gs-dev-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy gs-dev and smoke-check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '427ce73a5d3f4bb5589f1cff8d9a13f9' }}
        run: ./scripts/deploy-dev.sh
